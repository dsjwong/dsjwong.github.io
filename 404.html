<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Darren Wong</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<style>
  @font-face { font-family:"Inter"; font-weight:400 600; font-display:swap;
               src:url("/assets/fonts/inter-variable.woff2") format("woff2"); }
  @font-face { font-family:"Bricolage Grotesque"; font-weight:200 800; font-display:swap;
               src:url("/assets/fonts/bricolage-grotesque-variable.woff2") format("woff2"); }
</style>
<style>
  /* Same palette as css/styles.css — keep these in step if you change it. */
  :root { --paper:#F6F4EF; --ink:#14161A; --body:#3A3E46; --muted:#596069; --accent:#FFB703; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0F1012; --ink:#F3F1EA; --body:#BDBAB2; --muted:#9A978F; --accent:#FFC53D; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:2rem;
    background:var(--paper); color:var(--body);
    font-family:Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1 { font-family:"Bricolage Grotesque",sans-serif; font-size:clamp(3.5rem,12vw,7rem); line-height:1;
       color:var(--ink); letter-spacing:-.04em; font-weight:800; margin-bottom:1rem; }
  p { font-size:1.0625rem; line-height:1.7; margin-bottom:2rem; }
  a { color:var(--ink); text-decoration:none; font-weight:500;
      border-bottom:1px solid var(--accent); padding-bottom:2px; transition:color .2s; }
  a:hover { color:var(--accent); }
  .wrap { max-width:32rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Lost at the gate.</h1>
    <p>That page does not exist. Most likely a mistyped address, or a link that has moved.</p>
    <a href="/">Back to darrenwongsj.dev</a>
  </div>
</body>
